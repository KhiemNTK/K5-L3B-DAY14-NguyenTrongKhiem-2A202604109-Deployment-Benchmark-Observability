# ============================================================
# TODO (tiêu chí 12): cấu hình deploy Render (Blueprint) — có thể dùng thay railway.toml
#   services:
#     - type: web, runtime: docker, healthCheckPath: /health
#     - envVars: secret như AGENT_API_KEY dùng `generateValue: true` hoặc `sync: false`,
#       KHÔNG ghi thẳng giá trị
# ============================================================
services:
  - type: web
    name: ai-agent-prod
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-cache
          property: connectionString
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: DAILY_BUDGET_USD
        value: 10.0

  - type: redis
    name: redis-cache
    plan: free
    ipAllowList: []
