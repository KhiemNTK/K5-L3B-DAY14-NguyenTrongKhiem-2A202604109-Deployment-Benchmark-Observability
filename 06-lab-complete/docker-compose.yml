# ============================================================
# TODO (tiêu chí 2): chạy agent + redis bằng một lệnh `docker compose up`
#   • service agent: build từ Dockerfile, map port 8000, đọc thêm env từ .env
#     (dùng `required: false` để không có file .env vẫn chạy được)
#   • service redis: image redis:7-alpine, có healthcheck
#   • agent có REDIS_URL=redis://redis:6379/0 và depends_on redis
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - AGENT_API_KEY=dev-secret-key
      - RATE_LIMIT_PER_MINUTE=60
      - DAILY_BUDGET_USD=10.0
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
